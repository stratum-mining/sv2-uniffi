[package]
name = "sv2-uniffi"
version = "0.1.0"
edition = "2018"

[dependencies]
codec_sv2 = { version = "5.0.0", features = ["noise_sv2", "with_buffer_pool"] }
channels_sv2 = { version = "5.0.0" }
parsers_sv2 = { version = "0.3.0" }
common_messages_sv2 = { version = "7.0.0" }
mining_sv2 = { version = "9.0.0" }
job_declaration_sv2 = { version = "7.0.0" }
template_distribution_sv2 = { version = "5.0.0" }
noise_sv2 = { version = "1.4.2" }
binary_sv2 = { version = "5.0.1" }
extensions_sv2 = { version = "0.1.0" }

bitcoin = { version = "0.32.5" }

uniffi = { version = "=0.29.4", features = ["cli"] }

[build-dependencies]
uniffi = { version = "=0.29.4", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[lib]
crate-type = ["cdylib"]
name = "sv2"
