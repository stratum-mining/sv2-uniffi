# cbindgen settings for include/sv2_sri.h.  Regenerate with
#   cbindgen --config cbindgen.toml --crate sv2_sri --output include/sv2_sri.h .
# (build.sh checks the committed header is current when cbindgen is
# installed).
language = "C"
include_guard = "SV2_SRI_H"
cpp_compat = true
style = "both"
usize_is_size_t = true
documentation = true
documentation_style = "c99"
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
header = """
/*
 * sv2_sri: a C API over the Stratum V2 Reference Implementation crates
 * (stratum-mining/stratum).  See README.md.  Licensed under the MIT
 * license or the Apache License, Version 2.0, at your option (LICENSE-MIT,
 * LICENSE-APACHE at the root of the repository).
 */"""
autogen_warning = "/* Generated by cbindgen from src/; do not edit. */"
after_includes = """
/*
 * Memory
 *   Buffers belong to the caller.  The Rust allocations a caller holds are
 *   the objects of the _new() functions, each released with its _free():
 *   a Sv2SriNoise per connection, and in the channels API an allocator
 *   and a channel object per channel, which keeps the jobs it is given.
 *   Nothing here keeps a pointer the caller passed in after returning.
 *
 * Return values
 *   SV2_SRI_OK (0), a byte count where documented, SV2_SRI_NEED_MORE from
 *   sv2_sri_noise_read_frame(), or a negative SV2_SRI_ERR_* code.  The
 *   values are part of the API.
 *
 * Panics
 *   None reaches the caller.  A panic inside the library or the crates is
 *   caught and returned as SV2_SRI_ERR_INTERNAL (NULL from a constructor);
 *   the object the call was made on must then be freed, not used again.
 *
 * Messages
 *   sv2_sri_message_encode(const Sv2SriMessage *m, uint8_t *out, uint32_t cap)
 *     writes one complete plaintext frame into out: the 6 byte header,
 *     with the message type and the channel_msg bit mining_sv2 or
 *     common_messages_sv2 assigns, then the payload.  Returns the frame
 *     length, SV2_SRI_ERR_OVERFLOW, or SV2_SRI_ERR_INVALID for a field
 *     out of range (a nominal_hash_rate that is negative or not finite
 *     among them).  Byte fields of m are read only during the call.
 *
 *   sv2_sri_message_decode(uint16_t extension_type, uint8_t msg_type,
 *                          uint8_t *payload, uint32_t len, Sv2SriMessage *out)
 *     decodes the payload that follows a frame header, which must hold
 *     exactly one message, then TLV fields or nothing
 *     (SV2_SRI_ERR_TRAILING otherwise).  Byte fields of out point into
 *     payload and stay valid as long as it does.  binary_sv2 decodes from
 *     a mutable slice, hence the non-const pointer; the bytes are left as
 *     they were.
 *
 *   All pointers must be valid for the sizes given; NULL where a value is
 *   required returns SV2_SRI_ERR_INVALID.
 */"""

[parse]
parse_deps = false
